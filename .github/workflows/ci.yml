name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run full test sweep
        run: ./scripts/full-test-sweep.sh

      - name: Upload full sweep results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-sweep-results
          path: test-results/full-sweep/
          if-no-files-found: warn
          retention-days: 3

      - name: Clean up Docker Compose
        if: always()
        run: docker compose down --volumes --remove-orphans
