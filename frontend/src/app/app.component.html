<main class="todo-shell">
  <section class="todo-panel" aria-labelledby="todo-title">
    <header class="todo-header">
      <div>
        <p class="eyebrow">Container TODO</p>
        <h1 id="todo-title">TODO</h1>
      </div>
      <span class="count">{{ store.todos().length }}</span>
    </header>

    <form class="new-todo" (submit)="$event.preventDefault(); store.createTodo()">
      <label class="sr-only" for="new-title">New todo title</label>
      <input
        id="new-title"
        type="text"
        [value]="store.newTitle()"
        (input)="store.setNewTitle($any($event.target).value)"
        placeholder="Add a task"
        autocomplete="off"
      >
      <button type="submit">Add</button>
    </form>

    @if (store.errorMessage(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <div class="filters" aria-label="Todo filters">
      <button type="button" [class.active]="store.filter() === 'all'" (click)="store.setFilter('all')">All</button>
      <button type="button" [class.active]="store.filter() === 'active'" (click)="store.setFilter('active')">Active</button>
      <button type="button" [class.active]="store.filter() === 'completed'" (click)="store.setFilter('completed')">Completed</button>
    </div>

    <ul class="todo-list" aria-label="Todos">
      @for (todo of store.visibleTodos(); track store.trackTodo($index, todo)) {
        <li class="todo-item" data-testid="todo-item" [class.done]="todo.completed">
          <input
            type="checkbox"
            [checked]="todo.completed"
            [disabled]="store.isTogglePending(todo.id)"
            (change)="store.toggleTodo(todo)"
            aria-label="Toggle complete"
          >

          @if (store.editingId() === todo.id) {
            <label class="sr-only" for="edit-title">Edit todo title</label>
            <input
              id="edit-title"
              class="edit-input"
              type="text"
              [value]="store.editTitle()"
              (input)="store.setEditTitle($any($event.target).value)"
              autocomplete="off"
            >
            <button type="button" (click)="store.saveEdit()">Save</button>
            <button type="button" class="secondary" (click)="store.cancelEdit()">Cancel</button>
          } @else {
            <span class="todo-title">{{ todo.title }}</span>
            <button type="button" class="secondary" (click)="store.startEditing(todo)">Edit</button>
            <button type="button" class="danger" (click)="store.deleteTodo(todo.id)">Delete</button>
          }
        </li>
      } @empty {
        <li class="empty">No todos</li>
      }
    </ul>
  </section>
</main>
